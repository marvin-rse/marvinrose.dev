- title: "Normalize Once, Detect Everywhere: Inside Microsoft Sentinel's ASIM"
  date: 2026-10-20
  event: "Security Ninjas Germany"
  eventUrl: "https://www.linkedin.com/company/security-ninjas-germany/"
  location: "Microsoft, Munich"
  coSpeakers:
    - name: "Jannis Langthaler"
      url: "https://langthaler.blog/"
  format: "Session"
  language: "German"
  abstract: >-
    Every data source speaks its own dialect. The Advanced Security Information
    Model (ASIM) gives Microsoft Sentinel one schema to rule them all: write a
    detection once and let parsers do the translation. We look at how ASIM
    parsers work under the hood, where performance bites, and how to build
    custom parsers for sources Microsoft doesn't ship.
